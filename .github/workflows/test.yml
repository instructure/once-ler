name: Test Once-ler
on: [pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [3.3, 3.4]
        lockfile:
          - Gemfile.activerecord-7.1.lock
          - Gemfile.activerecord-7.2.lock
          - Gemfile.activerecord-8.0.lock
          - Gemfile.lock
    env:
      BUNDLE_LOCKFILE: ${{ matrix.lockfile }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "${{ matrix.ruby }}"
          bundler-cache: true
        env:
          BUNDLE_NO_PRUNE: true
      - name: Run tests
        run: bin/rspec
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true
      - name: Run RuboCop
        run: bin/rubocop
